name: pm
# 1100D power-management model A/B (ci/pm-suite.sh). Manual dispatch only.
# POST .../actions/workflows/pm.yml/dispatches {"ref": "<branch>"}
# Runs alone on the shared runner, so numbers are comparable within one run only.
on:
  workflow_dispatch:

jobs:
  pm:
    runs-on: linux-podman
    env:
      # Private org owning the ROM packages and the image registry (repo variable); server = this CI server.
      ROM_PKG_OWNER: ${{ vars.ROM_PKG_OWNER }}
      GITHUB_SERVER_URL: ${{ github.server_url }}
      SANDBOX: --rm --network=none --security-opt label=disable --cap-drop=all --security-opt no-new-privileges --pids-limit=512
    steps:
      - name: Checkout
        run: |
          rm -rf src-checkout && mkdir src-checkout && cd src-checkout
          git init -q .
          git -c "http.extraheader=Authorization: Bearer ${{ github.token }}" \
              fetch -q --depth=1 "${{ github.server_url }}/${{ github.repository }}.git" "${{ github.sha }}"
          git checkout -q FETCH_HEAD
          echo "runner: $(nproc) CPUs, $(free -m | awk '/Mem:/{print $2}') MiB RAM; load $(cut -d' ' -f1-3 /proc/loadavg)"

      - name: PM model A/B
        env:
          ROM_TOKEN: ${{ secrets.ROM_TOKEN }}
        run: |
          start=$(date +%s)
          src-checkout/ci/pm-suite.sh
          echo "suite done in $(( $(date +%s) - start ))s"

      - name: Upload results
        if: always()
        run: |
          rm -rf bench-artifacts && mkdir -p bench-artifacts
          if [ -d src-checkout/emu-out/pm ]; then cp -r src-checkout/emu-out/pm/. bench-artifacts/; fi
          find bench-artifacts -type f \( -iname '*.bin' -o -iname '*.img' -o -iname '*.qcow2' -o -iname '*.o' \
              -o -iname '*.elf' -o -iname '*.so' -o -iname '*.ppm' -o -size +20M \) -delete
          src-checkout/ci/upload-artifact.sh qemu-eos-pm bench-artifacts
